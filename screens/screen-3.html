<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BOG — პორტფელის სახელი</title>
<link rel="stylesheet" href="../styles.css">
</head>
<body class="prototype-body">
<div class="device">
  <div class="device-screen">

    <div class="navbar">
      <a class="icon-btn" href="screen-1.html" title="უკან">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 4L7 12l8 8"/></svg>
      </a>
      <div class="title">პორტფელის სახელი</div>
      <a class="icon-btn" href="hub.html" title="ჩატი">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16v12H8l-4 4V4z"/></svg>
      </a>
    </div>

    <div class="screen-content" style="padding-top:24px; gap:16px;">

      <div class="form-field">
        <div class="icon-circle"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7-10-7-10-7z"/><path d="M4 4l16 16"/></svg></div>
        <div class="field-text">
          <div class="field-label">სახელის გამოჩენა</div>
          <div class="field-value">S.J</div>
        </div>
        <a href="screen-2.html" class="toggle on" title="გადართვა"></a>
      </div>

      <p class="description-text">გაზიარდება მხოლოდ აქციების პროცენტული განაწილება. ამის შემდეგ ცვლილებებს თუ შეიტან, მხოლოდ შენთან იქნება ისახება</p>

      <div class="donut-wrap">
        <svg width="200" height="200" viewBox="0 0 220 220">
          <circle cx="110" cy="110" r="80" fill="none" stroke="#8b7ae8" stroke-width="34" stroke-dasharray="125.6 376.8" stroke-dashoffset="0" transform="rotate(-90 110 110)"/>
          <circle cx="110" cy="110" r="80" fill="none" stroke="#e05a5a" stroke-width="34" stroke-dasharray="125.6 376.8" stroke-dashoffset="-125.6" transform="rotate(-90 110 110)"/>
          <circle cx="110" cy="110" r="80" fill="none" stroke="#d9b35a" stroke-width="34" stroke-dasharray="125.6 376.8" stroke-dashoffset="-251.2" transform="rotate(-90 110 110)"/>
          <circle cx="110" cy="110" r="80" fill="none" stroke="#c98a55" stroke-width="34" stroke-dasharray="125.6 376.8" stroke-dashoffset="-376.8" transform="rotate(-90 110 110)"/>
        </svg>
        <div class="donut-center" style="flex-direction:column; text-align:center;">
          4 პოზიცია<br>
          <span style="color:var(--text-error); font-size:14px;">▼ 0.012%</span>
        </div>
        <div class="donut-label" style="top:0; left:0;">25% GOOG</div>
        <div class="donut-label" style="top:0; right:0;">25% QQQ</div>
        <div class="donut-label" style="bottom:0; left:0;">25% META</div>
        <div class="donut-label" style="bottom:0; right:0;">25% AMZN</div>
      </div>

      <div class="section">
        <div class="section-title">აქციები</div>
        <div class="asset-row">
          <div class="logo" style="background:#eee; color:#999;">A</div>
          <div class="text-col"><div class="ticker">APPL</div><div class="pct">25 %</div></div>
          <div class="right-col"><div class="change up">▲ 0.20%</div></div>
        </div>
        <div class="asset-row">
          <div class="logo" style="background:#eee; color:#999;">T</div>
          <div class="text-col"><div class="ticker">TSLA</div><div class="pct">25 %</div></div>
          <div class="right-col"><div class="change up">▲ 0.20%</div></div>
        </div>
      </div>

      <label class="checkbox-row">
        <input type="checkbox">
        Checkbox text <a href="#">link ↗</a>
      </label>

    </div>

    <div class="sticky-bar">
      <a class="btn btn-primary" href="portfolio.html">გასაჯაროება</a>
    </div>

  </div>
</div>
</body>
</html>
